<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Company Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .card {
            max-width: 600px;
            margin: 50px auto;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,.15);
        }

        h2 {
            color: #0d6efd;
            font-weight: bold;
        }

        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card p-4">

        <h2 class="text-center mb-4"
            th:text="${company.id == 0 ? 'Add Company' : 'Edit Company'}">
            Add Company
        </h2>

        <form th:action="@{/company/page/save}"
              th:object="${company}"
              method="post"
              novalidate>

            <input type="hidden" th:field="*{id}">

            <!-- Company Name -->
            <div class="mb-3">

                <label class="form-label">Company Name</label>

                <input type="text"
                       class="form-control"
                       th:field="*{companyName}"
                       placeholder="Enter company name">

                <div class="error-message"
                     th:if="${#fields.hasErrors('companyName')}"
                     th:errors="*{companyName}">
                </div>

            </div>

            <!-- Location -->
            <div class="mb-3">

                <label class="form-label">Location</label>

                <input type="text"
                       class="form-control"
                       th:field="*{location}"
                       placeholder="Enter company location">

                <div class="error-message"
                     th:if="${#fields.hasErrors('location')}"
                     th:errors="*{location}">
                </div>

            </div>

            <!-- Job Role -->
            <div class="mb-3">

                <label class="form-label">Job Role</label>

                <input type="text"
                       class="form-control"
                       th:field="*{role}"
                       placeholder="Enter job role">

                <div class="error-message"
                     th:if="${#fields.hasErrors('role')}"
                     th:errors="*{role}">
                </div>

            </div>

            <!-- Package -->
            <div class="mb-3">

                <label class="form-label">Package (LPA)</label>

                <input type="number"
                       step="0.01"
                       min="0.1"
                       class="form-control"
                       th:field="*{packageAmount}"
                       placeholder="Enter package">

                <div class="error-message"
                     th:if="${#fields.hasErrors('packageAmount')}"
                     th:errors="*{packageAmount}">
                </div>

            </div>

            <!-- Save Button -->
            <button type="submit"
                    class="btn btn-success w-100"
                    th:text="${company.id == 0 ? 'Save Company' : 'Update Company'}">
                Save Company
            </button>

            <!-- Back Button -->
            <a th:href="@{/company}"
               class="btn btn-secondary w-100 mt-2">
                Back
            </a>

        </form>

    </div>

</div>

</body>
</html>
