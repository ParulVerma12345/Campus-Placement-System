<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Placement Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .card {
            max-width: 600px;
            margin: 50px auto;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,.15);
        }

        h2 {
            color: #0d6efd;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card p-4">

        <h2 class="text-center mb-4"
            th:text="${placement.id == 0 ? 'Add Placement' : 'Edit Placement'}">
            Add Placement
        </h2>

        <form th:action="@{/placement/page/save}"
              th:object="${placement}"
              method="post">

            <!-- Hidden ID for Edit -->
            <input type="hidden" th:field="*{id}">

            <!-- Company Name -->
            <div class="mb-3">

                <label class="form-label">Company Name</label>

                <input type="text"
                       class="form-control"
                       th:field="*{companyName}"
                       placeholder="Enter company name"
                       required>

            </div>

            <!-- Student Name -->
            <div class="mb-3">

                <label class="form-label">Student Name</label>

                <input type="text"
                       class="form-control"
                       th:field="*{studentName}"
                       placeholder="Enter student name"
                       required>

            </div>

            <!-- Placement Status -->
            <div class="mb-3">

                <label class="form-label">Placement Status</label>

                <select class="form-select"
                        th:field="*{status}"
                        required>

                    <option value="">Select Status</option>
                    <option value="Selected">Selected</option>
                    <option value="Pending">Pending</option>
                    <option value="Rejected">Rejected</option>

                </select>

            </div>

            <!-- Package -->
            <div class="mb-3">

                <label class="form-label">Package (LPA)</label>

                <input type="number"
                       step="0.01"
                       min="0"
                       class="form-control"
                       th:field="*{packageAmount}"
                       placeholder="Enter package"
                       required>

            </div>

            <!-- Save Button -->
            <button type="submit"
                    class="btn btn-success w-100"
                    th:text="${placement.id == 0 ? 'Save Placement' : 'Update Placement'}">
                Save Placement
            </button>

            <!-- Back Button -->
            <a th:href="@{/placement}"
               class="btn btn-secondary w-100 mt-2">
                Back
            </a>

        </form>

    </div>

</div>

</body>
</html>
