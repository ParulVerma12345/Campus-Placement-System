<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .card {
            max-width: 600px;
            margin: 50px auto;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,.15);
        }

        h2 {
            color: #0d6efd;
            font-weight: bold;
        }

        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card p-4">

        <!-- Heading -->
        <h2 class="text-center mb-4"
            th:text="${student.id == 0 ? 'Add Student' : 'Edit Student'}">
            Add Student
        </h2>

        <!-- Student Form -->
        <form th:action="@{/student/save}"
              th:object="${student}"
              method="post"
              novalidate>

            <!-- Student ID -->
            <input type="hidden" th:field="*{id}">

            <!-- Student Name -->
            <div class="mb-3">

                <label class="form-label">Student Name</label>

                <input type="text"
                       class="form-control"
                       th:field="*{name}"
                       placeholder="Enter student name">

                <div class="error-message"
                     th:if="${#fields.hasErrors('name')}"
                     th:errors="*{name}">
                </div>

            </div>

            <!-- Email -->
            <div class="mb-3">

                <label class="form-label">Email</label>

                <input type="text"
                       class="form-control"
                       th:field="*{email}"
                       placeholder="Enter email address">

                <div class="error-message"
                     th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}">
                </div>

            </div>

            <!-- Branch -->
            <div class="mb-3">

                <label class="form-label">Branch</label>

                <input type="text"
                       class="form-control"
                       th:field="*{branch}"
                       placeholder="Enter branch">

                <div class="error-message"
                     th:if="${#fields.hasErrors('branch')}"
                     th:errors="*{branch}">
                </div>

            </div>

            <!-- CGPA -->
            <div class="mb-3">

                <label class="form-label">CGPA</label>

                <input type="number"
                       step="0.01"
                       min="0"
                       max="10"
                       class="form-control"
                       th:field="*{cgpa}"
                       placeholder="Enter CGPA">

                <div class="error-message"
                     th:if="${#fields.hasErrors('cgpa')}"
                     th:errors="*{cgpa}">
                </div>

            </div>

            <!-- Save / Update Button -->
            <button type="submit"
                    class="btn btn-success w-100"
                    th:text="${student.id == 0 ? 'Save Student' : 'Update Student'}">
                Save Student
            </button>

            <!-- Back Button -->
            <a th:href="@{/student}"
               class="btn btn-secondary w-100 mt-2">
                Back
            </a>

        </form>

    </div>

</div>

</body>
</html>
