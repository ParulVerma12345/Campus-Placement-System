<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Company Management</title>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>
    body {
      background: #f4f6f9;
    }

    .card {
      margin-top: 40px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,.15);
    }

    h2 {
      color: #0d6efd;
      font-weight: bold;
    }

    .table th, .table td {
      text-align: center;
      vertical-align: middle;
    }

    .search-box {
      background: #f8f9fa;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card p-4">

    <!-- Heading -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">

      <h2>🏢 Company Management</h2>

      <a th:href="@{/company/add}" class="btn btn-success">
        + Add Company
      </a>

    </div>


    <!-- Search and Filter -->
    <div class="search-box">

      <div class="row g-3">

        <!-- Search by Company Name -->
        <div class="col-md-5">

          <label class="form-label fw-bold">
            Search Company
          </label>

          <input type="text"
                 id="searchCompany"
                 class="form-control"
                 placeholder="Enter company name...">

        </div>


        <!-- Filter by Location -->
        <div class="col-md-5">

          <label class="form-label fw-bold">
            Filter by Location
          </label>

          <select id="locationFilter" class="form-select">

            <option value="">All Locations</option>

            <option value="Agra">Agra</option>
            <option value="Delhi">Delhi</option>
            <option value="Noida">Noida</option>
            <option value="Bangalore">Bangalore</option>
            <option value="Mumbai">Mumbai</option>
            <option value="Pune">Pune</option>
            <option value="Hyderabad">Hyderabad</option>
            <option value="Gurgaon">Gurgaon</option>

          </select>

        </div>


        <!-- Reset Button -->
        <div class="col-md-2 d-flex align-items-end">

          <button type="button"
                  class="btn btn-secondary w-100"
                  onclick="resetFilters()">
            Reset
          </button>

        </div>

      </div>

    </div>


    <!-- Company Table -->
    <div class="table-responsive">

      <table class="table table-bordered table-hover" id="companyTable">

        <thead class="table-dark">

        <tr>
          <th>ID</th>
          <th>Company Name</th>
          <th>Location</th>
          <th>Job Role</th>
          <th>Package (LPA)</th>
          <th>Action</th>
        </tr>

        </thead>

        <tbody id="companyTableBody">

        <tr th:each="company : ${companies}">

          <td th:text="${company.id}"></td>

          <td th:text="${company.companyName}"></td>

          <td th:text="${company.location}"></td>

          <td th:text="${company.role}"></td>

          <td th:text="${company.packageAmount}"></td>

          <td>

            <a th:href="@{/company/edit/{id}(id=${company.id})}"
               class="btn btn-warning btn-sm">
              Edit
            </a>

            <a th:href="@{/company/delete/{id}(id=${company.id})}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('Are you sure you want to delete this company?')">
              Delete
            </a>

          </td>

        </tr>


        <tr th:if="${#lists.isEmpty(companies)}"
            id="noCompanies">

          <td colspan="6" class="text-muted">
            No companies found. Please add a company.
          </td>

        </tr>

        </tbody>

      </table>

      <p id="noResult"
         class="text-danger text-center fw-bold"
         style="display:none;">
        No matching company found!
      </p>

    </div>


    <!-- Back Button -->
    <a th:href="@{/}" class="btn btn-secondary mt-3">
      Back to Home
    </a>

  </div>

</div>


<!-- Search and Filter JavaScript -->
<script>

  const searchInput = document.getElementById("searchCompany");

  const locationFilter = document.getElementById("locationFilter");


  function filterCompanies() {

    let searchValue = searchInput.value.toLowerCase().trim();

    let locationValue = locationFilter.value.toLowerCase().trim();

    let rows = document.querySelectorAll("#companyTableBody tr");

    let visibleCount = 0;


    rows.forEach(function(row) {

      if (row.id === "noCompanies") {
        return;
      }

      let companyName = row.cells[1].textContent.toLowerCase().trim();

      let location = row.cells[2].textContent.toLowerCase().trim();


      let nameMatch = companyName.includes(searchValue);

      let locationMatch =
              locationValue === "" || location === locationValue;


      if (nameMatch && locationMatch) {

        row.style.display = "";

        visibleCount++;

      } else {

        row.style.display = "none";

      }

    });


    document.getElementById("noResult").style.display =
            visibleCount === 0 ? "block" : "none";

  }


  function resetFilters() {

    searchInput.value = "";

    locationFilter.value = "";

    filterCompanies();

  }


  searchInput.addEventListener("input", filterCompanies);

  locationFilter.addEventListener("change", filterCompanies);

</script>

</body>
</html>
