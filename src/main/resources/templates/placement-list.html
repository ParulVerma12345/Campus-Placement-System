<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Placement Management</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .card {
            margin-top: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,.15);
        }

        h2 {
            color: #0d6efd;
            font-weight: bold;
        }

        .table th, .table td {
            text-align: center;
            vertical-align: middle;
        }

        .search-box {
            background: #f8f9fa;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card p-4">

        <!-- Heading -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">

            <h2>🎓 Placement Management</h2>

            <a th:href="@{/placement/add}" class="btn btn-success">
                + Add Placement
            </a>

        </div>


        <!-- Search and Filter Section -->
        <div class="search-box">

            <div class="row g-3">

                <!-- Search Student -->
                <div class="col-md-4">

                    <label class="form-label fw-bold">
                        Search Student Name
                    </label>

                    <input type="text"
                           id="searchStudent"
                           class="form-control"
                           placeholder="Enter student name...">

                </div>


                <!-- Search Company -->
                <div class="col-md-4">

                    <label class="form-label fw-bold">
                        Search Company Name
                    </label>

                    <input type="text"
                           id="searchCompany"
                           class="form-control"
                           placeholder="Enter company name...">

                </div>


                <!-- Filter Status -->
                <div class="col-md-2">

                    <label class="form-label fw-bold">
                        Filter Status
                    </label>

                    <select id="statusFilter" class="form-select">

                        <option value="">All Status</option>
                        <option value="Selected">Selected</option>
                        <option value="Pending">Pending</option>
                        <option value="Rejected">Rejected</option>

                    </select>

                </div>


                <!-- Reset Button -->
                <div class="col-md-2 d-flex align-items-end">

                    <button type="button"
                            class="btn btn-secondary w-100"
                            onclick="resetFilters()">
                        Reset
                    </button>

                </div>

            </div>

        </div>


        <!-- Placement Table -->
        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead class="table-dark">

                <tr>
                    <th>ID</th>
                    <th>Company Name</th>
                    <th>Student Name</th>
                    <th>Status</th>
                    <th>Package (LPA)</th>
                    <th>Action</th>
                </tr>

                </thead>


                <tbody id="placementTableBody">

                <tr th:each="placement : ${placements}">

                    <td th:text="${placement.id}"></td>

                    <td th:text="${placement.companyName}"></td>

                    <td th:text="${placement.studentName}"></td>

                    <td th:text="${placement.status}"></td>

                    <td th:text="${placement.packageAmount}"></td>

                    <td>

                        <a th:href="@{/placement/edit/{id}(id=${placement.id})}"
                           class="btn btn-warning btn-sm">
                            Edit
                        </a>

                        <a th:href="@{/placement/delete/{id}(id=${placement.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this placement?')">
                            Delete
                        </a>

                    </td>

                </tr>


                <tr th:if="${#lists.isEmpty(placements)}"
                    id="noPlacements">

                    <td colspan="6" class="text-muted">
                        No placement records found.
                    </td>

                </tr>

                </tbody>

            </table>

            <p id="noResult"
               class="text-danger text-center fw-bold"
               style="display:none;">
                No matching placement found!
            </p>

        </div>


        <!-- Back Button -->
        <a th:href="@{/}" class="btn btn-secondary mt-3">
            Back to Home
        </a>

    </div>

</div>


<!-- JavaScript for Search and Filter -->
<script>

    const studentInput = document.getElementById("searchStudent");

    const companyInput = document.getElementById("searchCompany");

    const statusFilter = document.getElementById("statusFilter");


    function filterPlacements() {

        let studentValue = studentInput.value.toLowerCase().trim();

        let companyValue = companyInput.value.toLowerCase().trim();

        let statusValue = statusFilter.value.toLowerCase().trim();


        let rows = document.querySelectorAll("#placementTableBody tr");

        let visibleCount = 0;


        rows.forEach(function(row) {

            if (row.id === "noPlacements") {
                return;
            }

            let companyName = row.cells[1].textContent.toLowerCase().trim();

            let studentName = row.cells[2].textContent.toLowerCase().trim();

            let status = row.cells[3].textContent.toLowerCase().trim();


            let studentMatch = studentName.includes(studentValue);

            let companyMatch = companyName.includes(companyValue);

            let statusMatch =
                statusValue === "" || status === statusValue;


            if (studentMatch && companyMatch && statusMatch) {

                row.style.display = "";

                visibleCount++;

            } else {

                row.style.display = "none";

            }

        });


        document.getElementById("noResult").style.display =
            visibleCount === 0 ? "block" : "none";

    }


    function resetFilters() {

        studentInput.value = "";

        companyInput.value = "";

        statusFilter.value = "";

        filterPlacements();

    }


    studentInput.addEventListener("input", filterPlacements);

    companyInput.addEventListener("input", filterPlacements);

    statusFilter.addEventListener("change", filterPlacements);

</script>

</body>
</html>
