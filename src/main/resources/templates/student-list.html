<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Student Management</title>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>
    body {
      background: #f4f6f9;
    }

    .card {
      margin-top: 40px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,.15);
    }

    h2 {
      color: #0d6efd;
      font-weight: bold;
    }

    .table th, .table td {
      vertical-align: middle;
      text-align: center;
    }

    .search-box {
      background: #f8f9fa;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card p-4">

    <!-- Heading -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">

      <h2>🎓 Student Management</h2>

      <a th:href="@{/student/add}" class="btn btn-success">
        + Add Student
      </a>

    </div>


    <!-- Search and Filter -->
    <div class="search-box">

      <div class="row g-3">

        <!-- Search by Name -->
        <div class="col-md-6">

          <label class="form-label fw-bold">
            Search Student by Name
          </label>

          <input type="text"
                 id="searchName"
                 class="form-control"
                 placeholder="Enter student name...">

        </div>


        <!-- Filter by Branch -->
        <div class="col-md-4">

          <label class="form-label fw-bold">
            Filter by Branch
          </label>

          <select id="branchFilter" class="form-select">

            <option value="">All Branches</option>
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="ECE">ECE</option>
            <option value="ME">ME</option>
            <option value="Civil">Civil</option>

          </select>

        </div>


        <!-- Reset Button -->
        <div class="col-md-2 d-flex align-items-end">

          <button type="button"
                  class="btn btn-secondary w-100"
                  onclick="resetFilters()">
            Reset
          </button>

        </div>

      </div>

    </div>


    <!-- Student Table -->
    <div class="table-responsive">

      <table class="table table-bordered table-hover" id="studentTable">

        <thead class="table-dark">

        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Branch</th>
          <th>CGPA</th>
          <th>Action</th>
        </tr>

        </thead>

        <tbody id="studentTableBody">

        <tr th:each="student : ${students}">

          <td th:text="${student.id}"></td>

          <td th:text="${student.name}"></td>

          <td th:text="${student.email}"></td>

          <td th:text="${student.branch}"></td>

          <td th:text="${student.cgpa}"></td>

          <td>

            <a th:href="@{/student/edit/{id}(id=${student.id})}"
               class="btn btn-warning btn-sm">
              Edit
            </a>

            <a th:href="@{/student/delete/{id}(id=${student.id})}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('Are you sure you want to delete this student?')">
              Delete
            </a>

          </td>

        </tr>


        <tr th:if="${#lists.isEmpty(students)}"
            id="noStudents">

          <td colspan="6" class="text-muted">
            No students found. Please add a student.
          </td>

        </tr>

        </tbody>

      </table>

      <p id="noResult"
         class="text-danger text-center fw-bold"
         style="display:none;">
        No matching student found!
      </p>

    </div>


    <!-- Back Button -->
    <a th:href="@{/}" class="btn btn-secondary mt-3">
      Back to Home
    </a>

  </div>

</div>


<!-- Search and Filter JavaScript -->
<script>

  const searchInput = document.getElementById("searchName");
  const branchFilter = document.getElementById("branchFilter");

  function filterStudents() {

    let searchValue = searchInput.value.toLowerCase().trim();
    let branchValue = branchFilter.value.toLowerCase().trim();

    let rows = document.querySelectorAll("#studentTableBody tr");

    let visibleCount = 0;

    rows.forEach(function(row) {

      if (row.id === "noStudents") {
        return;
      }

      let name = row.cells[1].textContent.toLowerCase().trim();
      let branch = row.cells[3].textContent.toLowerCase().trim();

      let nameMatch = name.includes(searchValue);
      let branchMatch = branchValue === "" || branch === branchValue;

      if (nameMatch && branchMatch) {

        row.style.display = "";
        visibleCount++;

      } else {

        row.style.display = "none";

      }

    });

    document.getElementById("noResult").style.display =
            visibleCount === 0 ? "block" : "none";

  }


  function resetFilters() {

    searchInput.value = "";
    branchFilter.value = "";

    filterStudents();

  }


  searchInput.addEventListener("input", filterStudents);

  branchFilter.addEventListener("change", filterStudents);

</script>

</body>
</html>
